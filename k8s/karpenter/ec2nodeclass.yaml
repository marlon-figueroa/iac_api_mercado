apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: "${KARPENTER_NODE_ROLE_NAME}"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
    - id: "${NODE_SECURITY_GROUP_ID}"
  tags:
    Project: api-mercado
    karpenter.sh/discovery: "${CLUSTER_NAME}"
