apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: api-mercado
  labels:
    app: fastapi
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      serviceAccountName: fastapi
      containers:
        - name: api
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - /bin/sh
            - -c
            - pip install --no-cache-dir -q -r requirements.txt && exec uvicorn main:app --host 0.0.0.0 --port 8000
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: AWS_REGION
              value: "${AWS_REGION}"
            - name: PRODUCTOS_TABLE
              value: "${PRODUCTOS_TABLE}"
            - name: CLIENTES_TABLE
              value: "${CLIENTES_TABLE}"
          volumeMounts:
            - name: source
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: source
          configMap:
            name: fastapi-source
