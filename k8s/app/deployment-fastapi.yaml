apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: api-mercado
  labels:
    app: fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      serviceAccountName: fastapi
      containers:
        - name: api
          image: "${FASTAPI_IMAGE}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: AWS_REGION
              value: "${AWS_REGION}"
            - name: PRODUCTOS_TABLE
              value: "${PRODUCTOS_TABLE}"
            - name: CLIENTES_TABLE
              value: "${CLIENTES_TABLE}"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
